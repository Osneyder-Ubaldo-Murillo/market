# ---------------------------------------------------------------------------
# Perfil "jpa": habilita persistencia real (MySQL) y auditoría (MongoDB).
# Uso:  mvn spring-boot:run -Dspring-boot.run.profiles=jpa
# En este perfil se LIMPIAN las exclusiones de auto-configuración del
# application.properties (dominio sin infraestructura) y se declara la conexión.
#
# IMPORTANTE: ajusta usuario/contraseña y conexiones a tus servicios locales.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=

# SQL principal (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/nexusmarket?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Auditoría (MongoDB) - usada por adapters.out.persistence.mongodb
spring.data.mongodb.uri=mongodb://localhost:27017/nexusmarket_audit
spring.data.mongodb.database=nexusmarket_audit