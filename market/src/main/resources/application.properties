spring.application.name=market

# ---------------------------------------------------------------------------
# Seguridad (adapters.out.security) - valores por defecto de desarrollo.
# En producción estos valores DEBEN sobrescribirse por variables de entorno.
# ---------------------------------------------------------------------------
jwt.secret=nexusmarket-dev-secret-change-me-in-production-0123456789abcdef
jwt.expiration=86400000
jwt.issuer=nexusmarket

# ---------------------------------------------------------------------------
# Corrección: excluir auto-configuraciones de persistencia.
# El módulo actual es únicamente DOMINIO (DDD): aún no existen adaptadores de
# salida ni base de datos configurada (ver SDD/Output Ports.md - pendiente).
# Sin estas exclusiones, Spring Boot (starters de JPA/Hibernate) intenta crear
# un DataSource Hikari sin URL JDBC y el contexto / los tests fallan con
# "Failed to determine a suitable driver class".
# Nombres verificados en spring-boot-jdbc-4.1.0.jar y spring-boot-hibernate-4.1.0.jar.
# Cuando se implementen los adaptadores de infraestructura, quitar estas
# exclusiones y declarar la URL de conexión en su lugar.
# ---------------------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,\
  org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration,\
  org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ---------------------------------------------------------------------------
# CORS (desarrollo): orígenes locales explícitos. En producción se define con
# CORS_ALLOWED_ORIGINS (ver application-prod.properties).
# ---------------------------------------------------------------------------
nexusmarket.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Documentación de la API habilitada en desarrollo (deshabilitada por defecto en prod).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Flyway solo se ejecuta en producción (application-prod.properties); desarrollo y pruebas
# usan el esquema generado por Hibernate (H2/MySQL local).
spring.flyway.enabled=false
# Única ubicación de migraciones, también cuando Flyway se active sin más configuración. La ubicación por defecto de
# Flyway (classpath:db/migration) contiene un V1 inválido y un V2 con cuentas sembradas de contraseña conocida, que
# NO deben ejecutarse nunca (ver market/docs/migrations/).
spring.flyway.locations=classpath:db/schema
