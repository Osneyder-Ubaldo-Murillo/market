# ==================================================================
# NexusMarket - Configuración de Producción (perfil "prod")
# ==================================================================
# Uso: java -jar market.jar --spring.profiles.active=prod
# O definir la variable de entorno SPRING_PROFILES_ACTIVE=prod
# ==================================================================

# ------------------------------------------------------------------
# Perfil activo: se define SOLO desde el entorno (SPRING_PROFILES_ACTIVE=jpa,prod).
# Un archivo específico de perfil no puede declarar spring.profiles.active.
# ------------------------------------------------------------------

# ------------------------------------------------------------------
# Spring Boot
# ------------------------------------------------------------------
server.port=8080
# Sin context-path: los controladores ya mapean "/api/...". Un context-path "/api"
# duplicaría el prefijo (/api/api/...). Healthcheck: /actuator/health.

# ------------------------------------------------------------------
# Datasource principal (MySQL 8) - SIN valores por defecto: URL, usuario y contraseña
# son obligatorios (variables de entorno o secretos). Si falta alguno, la aplicación no
# arranca. ProductionDatabaseCredentialsGuard rechaza además contraseñas de ejemplo.
# ------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
# Espera máxima por una conexión: con MySQL caído, cada petición tarda este tiempo en responder 503
# (ver docs/INDISPONIBILIDAD_BASE_DATOS.md). 10 s = innodb_lock_wait_timeout de abajo. Para sobrescribirlo por entorno use
# SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT (con guion bajo en CONNECTION_TIMEOUT Spring Boot falla al arrancar).
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Los casos de uso de pedidos e inventario bloquean filas (SELECT ... FOR UPDATE): una espera de bloqueo
# larga no debe retener hilos y conexiones. Al agotarse, la API responde 409 CONCURRENT_MODIFICATION.
spring.datasource.hikari.connection-init-sql=SET SESSION innodb_lock_wait_timeout=10

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# El dialecto se detecta solo (Hibernate 7 ya no incluye MySQL8Dialect).
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------------
# MongoDB (auditoría)
# ------------------------------------------------------------------
# Spring Boot 4: la URI de conexión es spring.mongodb.uri (spring.data.mongodb.uri ya no se aplica
# y el cliente caía a localhost:27017, dejando /actuator/health en DOWN).
# URI obligatoria (puede incluir credenciales); sin valor por defecto.
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI}}
spring.data.mongodb.database=nexusmarket_audit

# ------------------------------------------------------------------
# Flyway (migraciones de esquema)
# ------------------------------------------------------------------
spring.flyway.enabled=true
# Ubicación activa: SOLO db/schema. db/migration (V1__schema.sql, V2__seed.sql, historial
# desconocido) se conserva intacta pero no se ejecuta.
spring.flyway.locations=classpath:db/schema
# Sin baseline automático: una base con tablas y sin historial Flyway NO se adopta en
# silencio; Flyway se niega a migrar hasta que se decida un baseline manual y verificado.
spring.flyway.baseline-on-migrate=false
spring.flyway.table=flyway_schema_history

# ------------------------------------------------------------------
# JWT (seguridad) - JWT_SECRET es OBLIGATORIO: no existe valor de respaldo.
# Si falta, la aplicación no arranca. Mínimo 32 bytes (HS256); se rechazan valores
# de ejemplo y secretos predecibles. Generar con: openssl rand -base64 48
# ------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:nexusmarket}

# ------------------------------------------------------------------
# Actuator (monitoreo)
# ------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.info.env.enabled=true

# ------------------------------------------------------------------
# Swagger / OpenAPI
# ------------------------------------------------------------------
# Deshabilitados por defecto en producción; se activan explícitamente con
# SWAGGER_ENABLED=true (la documentación pasa a ser pública mientras esté activa).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=nexus.market.adapters.in.rest

# ------------------------------------------------------------------
# Proxy inverso (identificación del cliente para los límites de intentos y el bloqueo de cuentas)
# ------------------------------------------------------------------
# Lista de proxies PROPIOS en los que se confía para leer X-Forwarded-For: direcciones IP o CIDR separados por comas, p. ej.
#   TRUSTED_PROXIES=10.0.0.5,172.16.0.0/12
# Vacío por defecto: no se confía en ninguna cabecera y el cliente es la dirección de la conexión TCP. Sin esto, detrás de un
# proxy todos los clientes comparten la IP del proxy. Un valor no válido (o /0) impide arrancar. Ver docs/ENTORNOS.md.
nexusmarket.proxy.trusted-proxies=${TRUSTED_PROXIES:}

# ------------------------------------------------------------------
# CORS (configurado en SecurityConfiguration)
# ------------------------------------------------------------------
# Lista de orígenes EXACTOS separados por coma, p. ej.
#   CORS_ALLOWED_ORIGINS=https://tienda.ejemplo.com,https://admin.ejemplo.com
# Vacío por defecto: no se permite ningún origen cruzado hasta definir el dominio
# real del frontend. No se admiten comodines (la aplicación no arranca con "*").
nexusmarket.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}