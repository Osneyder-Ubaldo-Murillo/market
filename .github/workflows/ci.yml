name: CI/CD - NexusMarket

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'
  MAVEN_VERSION: '3.9.x'
  # OWASP Dependency-Check: version fijada (no se resuelve "la ultima"). Umbral: falla con CVSS >= 7.0.
  DEPENDENCY_CHECK_VERSION: '12.2.2'
  # Minimos de registros que el validador de la base de NVD exige (fase 2). Calibrados el 2026-11-01 con ~80 % de lo observado en
  # dos ejecuciones reales (vulnerability=246568, cpeEntry=268022, knownExploited=1766): detectan una descarga truncada, no
  # prueban que la base este completa. NVD solo crece: revisarlos de vez en cuando. Deben coincidir con los de
  # update-dependency-check-data.yml (ver market/docs/CI_CD.md y scripts/ci/NVD_VALIDATOR.md).
  NVD_MIN_VULNERABILITY: '200000'
  NVD_MIN_CPE_ENTRY: '215000'
  NVD_MIN_KNOWN_EXPLOITED: '1400'
  IMAGE_NAME: osneyder/nexusmarket

# Detalle de secretos, criterios y como habilitar el despliegue: market/docs/CI_CD.md

jobs:
  # ------------------------------------------------------------------
  # 1. Build, pruebas unitarias y pruebas de integracion con MySQL REAL
  # ------------------------------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./market

    # La base de datos MySQL DESECHABLE se inicia en un paso (docker run) y no como "services:", porque los servicios
    # de Actions no admiten argumentos de arranque del servidor y las pruebas de concurrencia necesitan
    # --max-connections=300 (el valor por defecto, 151, produce "Too many connections"). Credenciales solo de prueba:
    # el contenedor escucha unicamente en 127.0.0.1 del runner y se destruye al terminar el job.
    env:
      # Contrato real de las pruebas (@EnabledIfEnvironmentVariable / @TestPropertySource): estas tres variables.
      NEXUS_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/nexusmarket_ci?sslMode=DISABLED&allowPublicKeyRetrieval=true
      NEXUS_TEST_MYSQL_USER: root
      NEXUS_TEST_MYSQL_PASSWORD: ci-only-root-password

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper Maven
        run: chmod +x mvnw

      - name: Iniciar MySQL desechable (--max-connections=300)
        run: >-
          docker run -d --name nexusmarket-ci-mysql --tmpfs /var/lib/mysql:rw
          -p 127.0.0.1:3306:3306
          -e MYSQL_ROOT_PASSWORD=ci-only-root-password -e MYSQL_DATABASE=nexusmarket_ci
          mysql:8.0 --max-connections=300

      - name: Esperar a MySQL y comprobar el límite de conexiones
        run: |
          ready=0
          for _ in $(seq 1 60); do
            if docker exec nexusmarket-ci-mysql mysqladmin ping -h 127.0.0.1 -uroot -pci-only-root-password --silent 2>/dev/null; then
              ready=1; break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::MySQL no estuvo disponible en 180 s"
            docker logs --tail 50 nexusmarket-ci-mysql
            exit 1
          fi
          max="$(docker exec nexusmarket-ci-mysql mysql -uroot -pci-only-root-password -N -e 'select @@max_connections' 2>/dev/null)"
          echo "MySQL arrancó con max_connections = $max"
          if [ "$max" != "300" ]; then
            echo "::error::max_connections esperado 300, efectivo $max"
            exit 1
          fi

      - name: Compilar proyecto
        run: ./mvnw compile -DskipTests -q

      - name: Ejecutar pruebas unitarias y de integración (H2 y MySQL real)
        # Sin -Dspring.profiles.active=jpa: forzar ese perfil rompe MarketApplicationTests y BootstrapAdminStartupTest
        # (verificado en local); las pruebas declaran sus propios perfiles y propiedades.
        run: ./mvnw -B -ntp test

      - name: Verificar que las pruebas MySQL se ejecutaron (ninguna omitida)
        run: bash ../scripts/ci/verify-mysql-tests-ran.sh target/surefire-reports

      - name: Subir resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: market/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Eliminar el MySQL desechable
        if: always()
        run: docker ps -aq --filter name=nexusmarket-ci-mysql | xargs -r docker rm -f -v

  # ------------------------------------------------------------------
  # 2. Analisis de dependencias vulnerables (OWASP Dependency-Check)
  #    BLOQUEA el workflow: sin base de datos de NVD utilizable, con errores de analisis o con CVSS >= 7.
  # ------------------------------------------------------------------
  dependency-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./market

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper Maven
        working-directory: ./market
        run: chmod +x mvnw

      # Este job NO descarga NVD (-DautoUpdate=false), así que no usa NVD_API_KEY; esa clave solo es obligatoria en el
      # workflow de actualización. Solo restaura la última base publicada por el workflow
      # "Actualizar base de datos NVD (Dependency-Check)" (.github/workflows/update-dependency-check-data.yml).
      # Con restore-keys se elige la caché más reciente con el prefijo de esta versión del plugin; la clave principal
      # no existe nunca, así que siempre se restaura por prefijo.
      - name: Restaurar la última base de datos de NVD
        id: dc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-restore-latest
          restore-keys: |
            dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-

      - name: Comprobar que hay una base de datos de NVD utilizable
        env:
          MATCHED_KEY: ${{ steps.dc-cache.outputs.cache-matched-key }}
          EXPECTED_VERSION: ${{ env.DEPENDENCY_CHECK_VERSION }}
          MAX_AGE_DAYS: '7'
        run: |
          dir="$RUNNER_TEMP/dependency-check-data"
          marker="$dir/nexusmarket-nvd-update.properties"
          hint="Ejecute el workflow 'Actualizar base de datos NVD (Dependency-Check)' (Actions > ese workflow > Run workflow) y vuelva a lanzar este CI cuando termine con éxito."
          fail() { echo "::error::$1 $hint"; exit 1; }

          [ -n "$MATCHED_KEY" ] || fail "No hay ninguna base de datos de NVD en caché para Dependency-Check $EXPECTED_VERSION. El análisis NO se omite: el job falla."
          [ -f "$marker" ] || fail "La caché restaurada ($MATCHED_KEY) no contiene el marcador de actualización completa."
          [ -n "$(find "$dir" -name odc.mv.db -size +0 -print -quit)" ] || fail "La caché restaurada ($MATCHED_KEY) no contiene el archivo de base de datos odc.mv.db."

          version="$(sed -n 's/^dependency_check_version=//p' "$marker")"
          completed="$(sed -n 's/^completed_epoch=//p' "$marker")"
          [ "$version" = "$EXPECTED_VERSION" ] || fail "La base fue creada con Dependency-Check '$version', se esperaba '$EXPECTED_VERSION'."
          case "$completed" in ''|*[!0-9]*|??????????*?) fail "El marcador de actualización no tiene una fecha válida." ;; esac

          now="$(date -u +%s)"
          # Se tolera hasta 5 min de diferencia entre relojes de runners; una fecha más futura es inválida.
          [ "$completed" -le $(( now + 300 )) ] || fail "La fecha del marcador está en el futuro."
          age_days=$(( ( now - completed ) / 86400 ))
          [ "$age_days" -ge 0 ] || age_days=0
          echo "Base de datos NVD restaurada de la caché '$MATCHED_KEY'; última actualización completa hace $age_days día(s)."
          if [ "$age_days" -gt "$MAX_AGE_DAYS" ]; then
            fail "La base de datos de NVD tiene $age_days días (máximo $MAX_AGE_DAYS): el workflow programado de actualización lleva tiempo fallando."
          elif [ "$age_days" -gt 2 ]; then
            echo "::warning::La base de datos de NVD tiene $age_days días; revise el workflow de actualización."
          fi

      # Validador de la base de NVD (scripts/ci/validate-nvd-database.sh, ver scripts/ci/NVD_VALIDATOR.md): FASE 2 = BLOQUEA.
      # Cualquier resultado distinto de «aceptada» (1 rechazada, 2 uso o entorno incorrecto, 3 revisión humana) hace fallar el
      # job: no se analiza con una base que no se ha podido verificar. Exige el marcador de 13 claves (el que escribe el workflow
      # de actualización cuando el validador aprueba la base) y los minimos de registros de NVD_MIN_*. Lee una COPIA de la base.
      - name: Validar la base de datos de NVD (bloquea)
        timeout-minutes: 15
        run: |
          dir="$RUNNER_TEMP/dependency-check-data"
          vlog="$RUNNER_TEMP/nvd-validator.log"
          set +e
          ./mvnw -B -ntp -q dependency:get -Dartifact=com.h2database:h2:2.4.240 -Dtransitive=false > "$vlog" 2>&1 \
            && ./mvnw -B -ntp -q dependency:get -Dartifact=org.owasp:dependency-check-core:"$DEPENDENCY_CHECK_VERSION" -Dtransitive=false >> "$vlog" 2>&1
          resolve_rc=$?
          if [ "$resolve_rc" -ne 0 ]; then
            echo "No se pudieron resolver los JAR del validador (Maven terminó con código $resolve_rc)." >> "$vlog"
            rc=2
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/validate-nvd-database.sh" --mode verify --dir "$dir" --valid-hours 4 \
              --min-vulnerability "$NVD_MIN_VULNERABILITY" --min-cpe-entry "$NVD_MIN_CPE_ENTRY" \
              --min-known-exploited "$NVD_MIN_KNOWN_EXPLOITED" >> "$vlog" 2>&1
            rc=$?
          fi
          set -e
          sed -e 's/^::error::/[error] /' -e 's/^::warning::/[aviso] /' "$vlog"
          {
            echo "### Validador de la base de NVD (fase 2: bloquea)"
            echo ""
            echo "- Código de salida: \`$rc\` (0 válida, 1 rechazada, 2 uso o entorno incorrecto, 3 revisión humana)"
            echo "- Mínimos exigidos: vulnerability=$NVD_MIN_VULNERABILITY cpeEntry=$NVD_MIN_CPE_ENTRY knownExploited=$NVD_MIN_KNOWN_EXPLOITED"
            echo ""
            echo '```'
            sed -e 's/^::error::/[error] /' -e 's/^::warning::/[aviso] /' "$vlog" | head -c 60000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "::notice::Validador de NVD: base ACEPTADA (código 0)."
          elif [ "$rc" -eq 1 ]; then
            echo "::error::Validador de NVD: base RECHAZADA (código 1). El job falla: no se analiza con una base que no ha superado la validación. Revise el log; si la caché es antigua, ejecute el workflow de actualización de NVD."
            exit 1
          else
            echo "::error::Validador de NVD: no se pudo aprobar la base (código $rc; 2 = uso o entorno incorrecto, 3 = revisión humana). El job falla."
            exit 1
          fi

      - name: Ejecutar OWASP Dependency-Check ${{ env.DEPENDENCY_CHECK_VERSION }}
        timeout-minutes: 20
        run: >-
          ./mvnw -B -ntp
          org.owasp:dependency-check-maven:${{ env.DEPENDENCY_CHECK_VERSION }}:check
          -DfailBuildOnCVSS=7
          -DfailOnError=true
          -DautoUpdate=false
          -DdataDirectory=${{ runner.temp }}/dependency-check-data
          -DossIndexAnalyzerEnabled=false
          -DnodeAuditAnalyzerEnabled=false
          -DretireJsAnalyzerEnabled=false

      - name: Subir informe de Dependency-Check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: market/target/dependency-check-report.*
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. Verificacion de la imagen Docker (NO publica): construye, arranca con MySQL y MongoDB desechables,
  #    comprueba la salud y analiza vulnerabilidades con Trivy (HIGH/CRITICAL corregibles bloquean).
  # ------------------------------------------------------------------
  image-verify:
    needs: [build-and-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Construir la imagen (solo local en el runner)
        run: docker build -t nexusmarket:ci -f Dockerfile .

      - name: Prueba de arranque y salud de la imagen
        run: bash scripts/ci/smoke-test-image.sh nexusmarket:ci

      - name: Exportar la imagen verificada
        run: docker save nexusmarket:ci -o "${{ runner.temp }}/nexusmarket-image.tar"

      - name: Analizar vulnerabilidades de la imagen (Trivy)
        run: bash scripts/ci/scan-image.sh "${{ runner.temp }}/nexusmarket-image.tar"

      - name: Guardar la imagen verificada para su publicación
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: verified-image
          path: ${{ runner.temp }}/nexusmarket-image.tar
          retention-days: 1

  # ------------------------------------------------------------------
  # 4. Publicacion en Docker Hub (solo push a main). Publica EXACTAMENTE la imagen verificada en el job anterior
  #    y solo si pasaron pruebas (incluidas las de MySQL), Dependency-Check y la verificacion de la imagen.
  # ------------------------------------------------------------------
  build-docker:
    needs: [build-and-test, dependency-check, image-verify]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verificar secretos de Docker Hub (publicación bloqueada si faltan)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Faltan DOCKERHUB_USERNAME o DOCKERHUB_TOKEN. La publicación queda bloqueada."
            exit 1
          fi

      - name: Descargar la imagen verificada
        uses: actions/download-artifact@v4
        with:
          name: verified-image
          path: ${{ runner.temp }}

      - name: Cargar la imagen verificada
        run: docker load -i "${{ runner.temp }}/nexusmarket-image.tar"

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extraer metadata de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Publicar la imagen verificada
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag nexusmarket:ci "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  # ------------------------------------------------------------------
  # 5. Despliegue en staging: DESHABILITADO. No hay entorno de despliegue ni credenciales aprobados, y este
  #    workflow no debe informar de un despliegue que no ocurre. Si alguien lo habilita sin implementarlo, FALLA.
  #    Como habilitarlo: market/docs/CI_CD.md, seccion "Despliegue".
  # ------------------------------------------------------------------
  deploy-staging:
    needs: [build-docker]
    runs-on: ubuntu-latest
    if: ${{ false }}

    steps:
      - name: Despliegue no implementado
        run: |
          echo "::error::El despliegue a staging no está implementado. Ver market/docs/CI_CD.md."
          exit 1
