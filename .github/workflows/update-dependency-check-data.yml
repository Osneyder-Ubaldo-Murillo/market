name: Actualizar base de datos NVD (Dependency-Check)

# Mantiene la base de datos de vulnerabilidades (H2) que usa el job "dependency-check" de ci.yml, para que el CI no
# tenga que descargar NVD en cada ejecución. Detalle y diagnóstico: market/docs/CI_CD.md.
#
# Validador de la base (scripts/ci/validate-nvd-database.sh, ver scripts/ci/NVD_VALIDATOR.md): FASE 2 = BLOQUEA. Se ejecuta tras
# la actualización y, si no aprueba la base (con los minimos de registros de NVD_MIN_*), el run FALLA antes de escribir el
# marcador y de guardar la caché: la última base validada se conserva y el CI sigue usándola (hasta 7 días de antigüedad). Solo
# una base aprobada se publica, siempre con el marcador completo de 13 claves.
#
# Ejecución manual desde una rama que no es main (Run workflow → elegir la rama): restaura la caché de main (las cachés de la
# rama por defecto son legibles desde cualquier rama), actualiza y valida, pero NUNCA guarda caché (el paso de guardado solo
# corre en main) y se niega a descargar NVD completo si no hay una base previa que restaurar.
on:
  workflow_dispatch:
  schedule:
    # Diario, a una hora no redonda (03:23 UTC) para evitar los picos de carga de GitHub Actions.
    - cron: '23 3 * * *'

# Solo se necesita leer el repositorio (checkout). actions/cache usa su propio token de ejecución.
permissions:
  contents: read

# Una sola actualización a la vez. Sin cancelar la que está en curso: cancelarla a medias descartaría horas de descarga.
concurrency:
  group: dependency-check-data-update
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  # Debe coincidir con DEPENDENCY_CHECK_VERSION de ci.yml: la versión forma parte del nombre de la caché y el formato de
  # la base H2 no es compatible entre versiones mayores.
  DEPENDENCY_CHECK_VERSION: '12.2.2'
  # Minimos de registros que exige el validador (fase 2). Deben coincidir con los de ci.yml (alli esta el criterio de calibracion).
  NVD_MIN_VULNERABILITY: '200000'
  NVD_MIN_CPE_ENTRY: '215000'
  NVD_MIN_KNOWN_EXPLOITED: '1400'

jobs:
  update-nvd-data:
    runs-on: ubuntu-latest
    # Presupuesto de tiempo (límite de un job en runners de GitHub: 6 h = 360 min):
    #   preparación ~2 min + actualización (paso, 320 min) + comprobación y guardado de la caché (~15 min) + margen.
    # El job se corta a los 350 min para que sea GitHub quien lo cierre limpiamente antes del límite duro. Si la primera
    # descarga completa no cabe en 320 min, el paso falla por tiempo, NO se guarda ninguna caché y el CI seguirá
    # fallando con el mensaje de "no hay base de datos". El ritmo observado (~1.400 registros/min, 170.000 de 416.000 en
    # 120 min) extrapolado linealmente da ~295 min, pero es una estimación, no una garantía.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: ./market

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Dar permisos al wrapper Maven
        run: chmod +x mvnw

      - name: Verificar que existe la clave de la API de NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Falta el secreto NVD_API_KEY. Sin él la actualización de NVD es extremadamente lenta o falla; no se actualiza la base."
            exit 1
          fi

      # Las cachés de GitHub son inmutables: una clave existente no se puede reescribir. Por eso cada ejecución publica una
      # clave NUEVA (única por ejecución e intento) y restaura la más reciente por prefijo. La clave principal es única,
      # así que nunca hay "hit" exacto: siempre se parte de la última base válida (si existe) y se actualiza.
      - name: Restaurar la última base de datos de NVD
        id: dc-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dependency-check-data-${{ env.DEPENDENCY_CHECK_VERSION }}-

      # Fuera de main no se admite una descarga completa de NVD (horas de API y de ejecución): si no hay caché de la que partir,
      # el run se detiene aquí. En main se conserva el comportamiento de siempre (la primera vez sí descarga todo).
      - name: Exigir una base previa en ejecuciones fuera de main
        if: github.ref != 'refs/heads/main' && steps.dc-cache.outputs.cache-matched-key == ''
        run: |
          echo "::error::No hay ninguna base de NVD en caché que restaurar y este run no es de main: se detiene para no iniciar una descarga completa de NVD desde una rama. Ejecute primero el workflow en main."
          exit 1

      # Inicio de la actualización para el validador (--job-start-epoch): se captura DESPUÉS de restaurar la caché y justo antes
      # de «update-only», como exige scripts/ci/NVD_VALIDATOR.md.
      - name: Registrar el inicio de la actualización
        id: nvd-start
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Actualizar la base de datos de NVD (${{ env.DEPENDENCY_CHECK_VERSION }})
        # Los errores no se toleran: si la actualización falla o excede el tiempo, el job falla y no se guarda caché.
        # La documentación consultada no garantiza que una actualización interrumpida se reanude; se asume que NO.
        timeout-minutes: 320
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # El registro se guarda fuera del directorio de datos (no entra en la caché). pipefail: si Maven falla, el paso falla.
        run: |
          set -o pipefail
          ./mvnw -B -ntp \
            org.owasp:dependency-check-maven:${{ env.DEPENDENCY_CHECK_VERSION }}:update-only \
            -DfailOnError=true \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            -DdataDirectory=${{ runner.temp }}/dependency-check-data \
            -DossIndexAnalyzerEnabled=false 2>&1 | tee "$RUNNER_TEMP/nvd-update.log"

      # Solo llega aquí si el paso anterior terminó con éxito (condición por defecto de los pasos).
      # El marcador se escribe DESPUÉS de la actualización y es lo que el CI exige para aceptar la base.
      - name: Comprobar la base actualizada y escribir el marcador
        env:
          JOB_START_EPOCH: ${{ steps.nvd-start.outputs.epoch }}
        run: |
          dir="$RUNNER_TEMP/dependency-check-data"
          log="$RUNNER_TEMP/nvd-update.log"
          if [ -z "$(find "$dir" -name odc.mv.db -size +0 -print -quit)" ]; then
            echo "::error::La actualización terminó pero no existe un odc.mv.db no vacío en $dir. No se guarda la caché."
            exit 1
          fi
          # En Dependency-Check 12.2.2 (Engine.doUpdates) un fallo de la descarga de NVD se registra como error y la
          # ejecución continúa: "update-only" puede terminar con código 0 aunque la actualización haya fallado. Por eso el
          # código de salida no basta: se rechaza el marcador si el registro contiene un error de actualización. Engine registra
          # cada fallo con LOGGER.error(mensaje, excepción), así que aparece el nombre de la clase UpdateException (cualquier
          # fuente: NVD, KEV...) y/o el mensaje. Es deliberadamente estricto: ante la duda NO se publica la caché.
          errors='UpdateException|Error updating the NVD Data|Exception processing NVD API Results|NVD Returned Status Code|unable to update the data to use the most current data|download was interrupted|was interrupted during'
          if grep -E -q "$errors" "$log"; then
            echo "::error::El registro de update-only contiene errores de actualización aunque Maven terminó con éxito. No se escribe el marcador ni se guarda la caché."
            grep -E "$errors" "$log" | head -5
            exit 1
          fi
          grep -E 'NVD API has .* records in this update|Skipping the NVD API Update as it was completed' "$log" \
            || echo "::warning::No se encontró en el registro la línea de resumen de la actualización de NVD."

          # ---- Validador de la base de NVD: FASE 2 (bloquea). Si no aprueba la base, el run falla y no se escribe marcador ni caché. ----
          # Lee una COPIA de la base (la original no se modifica). Códigos: 0 válida, 1 rechazada, 2 uso o entorno incorrecto,
          # 3 revisión humana. Los JAR de H2 y dependency-check-core se resuelven aquí; si no se pueden resolver, es el código 2.
          emit="$RUNNER_TEMP/nvd-validator-emit.env"
          vlog="$RUNNER_TEMP/nvd-validator.log"
          rm -f "$emit"
          set +e
          ./mvnw -B -ntp -q dependency:get -Dartifact=com.h2database:h2:2.4.240 -Dtransitive=false > "$vlog" 2>&1 \
            && ./mvnw -B -ntp -q dependency:get -Dartifact=org.owasp:dependency-check-core:"$DEPENDENCY_CHECK_VERSION" -Dtransitive=false >> "$vlog" 2>&1
          resolve_rc=$?
          if [ "$resolve_rc" -ne 0 ]; then
            echo "No se pudieron resolver los JAR del validador (Maven terminó con código $resolve_rc)." >> "$vlog"
            rc=2
          else
            bash "$GITHUB_WORKSPACE/scripts/ci/validate-nvd-database.sh" --mode create --dir "$dir" \
              --valid-hours 4 --job-start-epoch "$JOB_START_EPOCH" --emit "$emit" \
              --min-vulnerability "$NVD_MIN_VULNERABILITY" --min-cpe-entry "$NVD_MIN_CPE_ENTRY" \
              --min-known-exploited "$NVD_MIN_KNOWN_EXPLOITED" >> "$vlog" 2>&1
            rc=$?
          fi
          set -e
          # Se muestra el resultado sin los prefijos de anotación del validador: abajo se emite UNA anotación por resultado.
          sed -e 's/^::error::/[error] /' -e 's/^::warning::/[aviso] /' "$vlog"
          verified=0
          if [ "$rc" -eq 0 ] && [ -s "$emit" ]; then verified=1; fi
          {
            echo "### Validador de la base de NVD (fase 2: bloquea)"
            echo ""
            echo "- Código de salida: \`$rc\` (0 válida, 1 rechazada, 2 uso o entorno incorrecto, 3 revisión humana)"
            echo "- Mínimos exigidos: vulnerability=$NVD_MIN_VULNERABILITY cpeEntry=$NVD_MIN_CPE_ENTRY knownExploited=$NVD_MIN_KNOWN_EXPLOITED"
            if [ "$verified" -eq 1 ]; then
              echo "- Resultado: **base aprobada; se publica con el marcador de 13 claves**"
              echo "- Se publica en la caché: $([ "$GITHUB_REF" = refs/heads/main ] && echo sí || echo 'no (este run no es de main)')"
            else
              echo "- Resultado: **base NO aprobada; el run falla y NO se publica ninguna caché (se conserva la anterior)**"
            fi
            echo ""
            echo '```'
            sed -e 's/^::error::/[error] /' -e 's/^::warning::/[aviso] /' "$vlog" | head -c 60000 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ] && [ "$verified" -eq 1 ]; then
            echo "::notice::Validador de NVD: base ACEPTADA (código 0). Se publica con el marcador completo de 13 claves."
          elif [ "$rc" -eq 0 ]; then
            echo "::error::Validador de NVD: código 0 pero --emit no escribió ningún dato. No se escribe el marcador ni se guarda la caché."
            exit 1
          elif [ "$rc" -eq 1 ]; then
            echo "::error::Validador de NVD: base RECHAZADA (código 1). No se escribe el marcador ni se guarda la caché; se conserva la base anterior. Revise el log."
            exit 1
          else
            echo "::error::Validador de NVD: no se pudo aprobar la base (código $rc; 2 = uso o entorno incorrecto, 3 = revisión humana). No se escribe el marcador ni se guarda la caché."
            exit 1
          fi

          # Marcador de 13 claves: lo emitido por el validador (8 claves) + el contexto de la ejecución (5 claves).
          {
            cat "$emit"
            echo "dependency_check_version=$DEPENDENCY_CHECK_VERSION"
            echo "completed_epoch=$(date -u +%s)"
            echo "completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
          } > "$dir/nexusmarket-nvd-update.properties"
          echo "Base de datos NVD actualizada, validada y marcada como completa ($(wc -l < "$dir/nexusmarket-nvd-update.properties") claves en el marcador):"
          cat "$dir/nexusmarket-nvd-update.properties"

      # SOLO en main: una ejecución manual desde otra rama valida y informa, pero nunca publica caché.
      - name: Guardar la base de datos de NVD en la caché
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: ${{ steps.dc-cache.outputs.cache-primary-key }}
